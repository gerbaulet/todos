services:
  todo:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/todo", "healthcheck"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 3s
      start_interval: 1s
